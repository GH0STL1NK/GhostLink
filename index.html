
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030806">
<title>GhostLink Network</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#030806;
 color:#00ff80;
 font-family:monospace;
 min-height:100vh;
}

header{
 text-align:center;
 padding:30px 12px;
 background:#07130c;
 border-bottom:1px solid #00ff8055;
}

header h1{
 font-size:38px;
 letter-spacing:6px;
 text-shadow:0 0 18px #00ff80;
}

.container{
 max-width:900px;
 margin:30px auto;
 padding:12px;
}

.panel{
 background:#08110c;
 border:1px solid #00ff8055;
 border-radius:12px;
 padding:22px;
 box-shadow:0 0 20px #00ff8015;
}

h2,h3{margin-bottom:16px}

input,button{
 width:100%;
 padding:15px;
 margin-top:12px;
 background:#020604;
 color:#00ff80;
 border:1px solid #00ff8066;
 border-radius:7px;
 font-family:monospace;
 font-size:16px;
 outline:none;
}

input:focus{
 border-color:#00ff80;
 box-shadow:0 0 12px #00ff8033;
}

button{
 background:#06351e;
 cursor:pointer;
 font-weight:bold;
}

button:hover{
 background:#00ff80;
 color:#000;
}

button:disabled{
 opacity:.5;
}

.hidden{display:none!important}

#authStatus{
 margin-top:15px;
 color:#ff6666;
 overflow-wrap:anywhere;
 line-height:1.5;
}

.rooms{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:15px 0;
}

.rooms button{
 flex:1;
 min-width:105px;
}

.rooms button.active{
 background:#00ff80;
 color:#000;
}

#messages{
 height:350px;
 overflow-y:auto;
 background:#020604;
 border:1px solid #145d39;
 padding:12px;
 border-radius:6px;
}

.message{
 padding:12px;
 margin-bottom:10px;
 background:#0b1910;
 border-left:3px solid #00ff80;
 overflow-wrap:anywhere;
}

.username{
 color:#00ff80;
 font-weight:bold;
}

.admin{
 color:#3995ff;
 font-weight:bold;
}

.admin-badge{
 color:#3995ff;
 border:1px solid #3995ff;
 padding:2px 5px;
 border-radius:4px;
 font-size:10px;
 margin-left:6px;
}

.message small{
 display:block;
 color:#668875;
 margin-top:7px;
}

#chatForm{
 display:flex;
 gap:8px;
 margin-top:10px;
}

#chatForm input{flex:1}
#chatForm button{width:85px}

.status{
 color:#00ff80;
 margin-bottom:12px;
}

.admin-text{
 color:#3995ff;
 font-weight:bold;
}

footer{
 text-align:center;
 padding:30px;
 color:#426b53;
}

@media(max-width:500px){
 header h1{font-size:30px}
 .panel{padding:15px}
 #chatForm button{width:75px}
}
</style>
</head>

<body>

<header>
 <h1>GHOSTLINK</h1>
</header>

<div class="container">

 <section id="loginPanel" class="panel">

  <h2>IDENTITY VERIFICATION</h2>

  <input
   id="username"
   type="text"
   maxlength="25"
   placeholder="Kullanıcı adınızı girin..."
   autocomplete="off">

  <button id="enterBtn">GİRİŞ YAP</button>

  <p style="text-align:center;margin:17px;color:#456b51">
   ───── VEYA ─────
  </p>

  <button id="adminBtn">
   ADMIN GOOGLE LOGIN
  </button>

  <p id="authStatus" role="alert"></p>

 </section>

 <section id="chatPanel" class="panel hidden">

  <div class="status">
   ● SYSTEM ONLINE
   <span id="currentUser"></span>
  </div>

  <button id="logoutBtn">ÇIKIŞ YAP</button>

  <h3 style="margin-top:22px">CHAT CHANNELS</h3>

  <div class="rooms">
   <button data-room="General" class="active">General</button>
   <button data-room="Cyber Security">Cyber Security</button>
   <button data-room="Linux">Linux</button>
   <button data-room="Programming">Programming</button>
   <button data-room="Technology">Technology</button>
  </div>

  <h3 id="roomTitle"># General</h3>

  <div id="messages">Bağlanıyor...</div>

  <form id="chatForm">
   <input
    id="messageInput"
    maxlength="1000"
    placeholder="Mesajınızı yazın..."
    autocomplete="off">

   <button id="sendBtn" type="submit">GÖNDER</button>
  </form>

 </section>

</div>

<footer>GHOSTLINK NETWORK © 2026</footer>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
 getAuth,
 signInAnonymously,
 GoogleAuthProvider,
 signInWithPopup,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 query,
 where,
 onSnapshot,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

// FIREBASE CONFIG

const firebaseConfig = {
 apiKey: "AIzaSyAvoiBmcERGKNEkdXTVbpzyfbqkJn8x0DA",
 authDomain: "ghostlink-f0ea0.firebaseapp.com",
 projectId: "ghostlink-f0ea0",
 storageBucket: "ghostlink-f0ea0.firebasestorage.app",
 messagingSenderId: "420490121530",
 appId: "1:420490121530:web:ec8d4bc44513c50b280003",
 measurementId: "G-BS8HBQQQB3"
};

// ADMIN

const ADMIN_EMAIL = "mhrrmovamin60@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let currentRoom = "General";
let currentUsername = "";
let isAdmin = false;
let unsubscribeMessages = null;

function error(message){
 $("authStatus").textContent = message;
}

// NORMAL LOGIN

$("enterBtn").onclick = async () => {

 const username = $("username").value.trim();

 if(username.length < 2 || username.length > 25){
  error("Kullanıcı adı 2-25 karakter olmalıdır.");
  return;
 }

 if(username.toUpperCase() === "ADMIN"){
  error("Bu kullanıcı adı yöneticiye ayrılmıştır.");
  return;
 }

 if(!/^[\p{L}\p{N}_ -]+$/u.test(username)){
  error("Geçersiz kullanıcı adı.");
  return;
 }

 $("enterBtn").disabled = true;
 error("");

 try{

  if(auth.currentUser){
   await signOut(auth);
  }

  currentUsername = username;

  localStorage.setItem("ghostlink_username",username);

  await signInAnonymously(auth);

 }catch(e){

  error("Firebase: "+e.code+" - "+e.message);
  $("enterBtn").disabled = false;

 }
};

// ADMIN GOOGLE LOGIN

$("adminBtn").onclick = async () => {

 $("adminBtn").disabled = true;
 error("");

 try{

  if(auth.currentUser){
   await signOut(auth);
  }

  const provider = new GoogleAuthProvider();

  provider.setCustomParameters({
   prompt:"select_account"
  });

  const result = await signInWithPopup(auth,provider);

  const email = (result.user.email || "").toLowerCase();

  if(
   email !== ADMIN_EMAIL.toLowerCase() ||
   !result.user.emailVerified
  ){

   await signOut(auth);

   error("Bu Google hesabının yönetici yetkisi yok.");

  }

 }catch(e){

  error("Admin giriş hatası: "+e.code+" - "+e.message);

 }finally{

  $("adminBtn").disabled = false;

 }
};

// AUTH STATE

onAuthStateChanged(auth,user => {

 $("enterBtn").disabled = false;

 if(!user){

  $("loginPanel").classList.remove("hidden");
  $("chatPanel").classList.add("hidden");

  if(unsubscribeMessages){
   unsubscribeMessages();
   unsubscribeMessages = null;
  }

  return;
 }

 if(user.isAnonymous){

  isAdmin = false;

  currentUsername =
   localStorage.getItem("ghostlink_username") || "";

  if(!currentUsername){
   signOut(auth);
   return;
  }

 }else if(
  user.email &&
  user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() &&
  user.emailVerified
 ){

  isAdmin = true;
  currentUsername = "ADMIN";

 }else{

  signOut(auth);
  return;

 }

 $("loginPanel").classList.add("hidden");
 $("chatPanel").classList.remove("hidden");

 $("currentUser").textContent = " | "+currentUsername;

 $("currentUser").className =
  isAdmin ? "admin-text" : "";

 loadMessages();

});

// LOGOUT

$("logoutBtn").onclick = async () => {

 localStorage.removeItem("ghostlink_username");

 await signOut(auth);

};

// LOAD MESSAGES

function loadMessages(){

 if(unsubscribeMessages){
  unsubscribeMessages();
 }

 $("messages").textContent = "Mesajlar yükleniyor...";

 const q = query(
  collection(db,"messages"),
  where("room","==",currentRoom)
 );

 unsubscribeMessages = onSnapshot(q,snapshot => {

  const list = [];

  snapshot.forEach(doc => {
   list.push(doc.data());
  });

  list.sort((a,b) =>
   (a.createdAt?.toMillis?.() || 0) -
   (b.createdAt?.toMillis?.() || 0)
  );

  $("messages").innerHTML = "";

  list.slice(-100).forEach(data => {

   const message = document.createElement("div");
   message.className = "message";

   const name = document.createElement("span");

   name.className = data.isAdmin ? "admin" : "username";
   name.textContent = data.username || "Anonymous";

   if(data.isAdmin){

    const badge = document.createElement("span");
    badge.className = "admin-badge";
    badge.textContent = "ADMIN";

    name.appendChild(badge);

   }

   const content = document.createElement("div");
   content.textContent = data.text || "";

   const time = document.createElement("small");

   time.textContent = data.createdAt?.toDate
    ? data.createdAt.toDate().toLocaleTimeString()
    : "Gönderiliyor...";

   message.append(name,content,time);

   $("messages").appendChild(message);

  });

  $("messages").scrollTop = $("messages").scrollHeight;

 },e => {

  $("messages").textContent =
   "Firestore hatası: "+e.code;

 });

}

// SEND MESSAGE

$("chatForm").onsubmit = async event => {

 event.preventDefault();

 const text = $("messageInput").value.trim();

 if(!text || !auth.currentUser) return;

 const button = $("sendBtn");
 button.disabled = true;

 try{

  await addDoc(collection(db,"messages"),{

   uid:auth.currentUser.uid,
   username:currentUsername,
   isAdmin:isAdmin,
   text:text,
   room:currentRoom,
   createdAt:serverTimestamp()

  });

  $("messageInput").value = "";

 }catch(e){

  alert("Mesaj hatası: "+e.code+" - "+e.message);

 }finally{

  button.disabled = false;

 }

};

// ROOM SWITCH

document.querySelectorAll("[data-room]").forEach(button => {

 button.onclick = () => {

  currentRoom = button.dataset.room;

  document.querySelectorAll("[data-room]")
   .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  $("roomTitle").textContent = "# "+currentRoom;

  loadMessages();

 };

});

</script>

</body>
</html>
