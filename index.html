<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GhostLink</title>
<style>
:root{--bg:#050807;--panel:#0a110f;--line:#13302a;--green:#00ff9c;--blue:#2fa8ff;--text:#cfeee3;--dim:#5f8277;--err:#ff4d6d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace}
button,input{font-family:inherit;font-size:16px}
#app{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}

/* loading */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50}
.spin{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--green);border-right-color:var(--blue);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* login */
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 0 40px rgba(0,255,156,.08);animation:up .5s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{font-size:32px;font-weight:bold;letter-spacing:2px;color:var(--blue);text-shadow:0 0 14px rgba(47,168,255,.6)}
.logo span{color:var(--green);text-shadow:0 0 14px rgba(0,255,156,.6)}
.sub{color:var(--dim);margin:6px 0 22px;font-size:13px}
.sub:after{content:"_";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
input[type=text]{width:100%;background:#000;border:1px solid var(--line);color:var(--green);padding:12px 14px;border-radius:8px;outline:none;transition:.2s}
input[type=text]:focus{border-color:var(--green);box-shadow:0 0 10px rgba(0,255,156,.25)}
.btn{background:transparent;border:1px solid var(--green);color:var(--green);padding:12px 18px;border-radius:8px;cursor:pointer;transition:.2s;font-weight:bold}
.btn:hover:not(:disabled){background:var(--green);color:#000;box-shadow:0 0 16px rgba(0,255,156,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%;margin-top:14px}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
.hint{color:var(--dim);font-size:12px;margin-top:8px}

/* chat layout */
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
header .logo{font-size:20px}
.grow{flex:1}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--err);box-shadow:0 0 8px currentColor;color:var(--err)}
.dot.on{background:var(--green);color:var(--green)}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--green);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.iconbtn:hover{border-color:var(--green)}
#rooms{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#070d0b;border-bottom:1px solid var(--line);scrollbar-width:none}
#rooms::-webkit-scrollbar{display:none}
.room{flex:none;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px;transition:.2s}
.room.active{color:#000;background:var(--green);border-color:var(--green);box-shadow:0 0 12px rgba(0,255,156,.4)}
#main{flex:1;display:flex;min-height:0;position:relative}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:min(82%,640px);background:var(--panel);border:1px solid var(--line);border-radius:12px;border-top-left-radius:3px;padding:8px 12px;animation:pop .25s ease;align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;border-top-left-radius:12px;border-top-right-radius:3px;border-color:#1b4a3d;background:#0b1a16}
.msg.sys{align-self:center;max-width:90%;text-align:center;border-style:dashed;color:var(--dim);font-size:13px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.meta{display:flex;gap:10px;align-items:baseline;font-size:12px;margin-bottom:3px}
.uname{color:var(--green);font-weight:bold;cursor:pointer;text-shadow:0 0 8px rgba(0,255,156,.35)}
.uname.gl{color:var(--blue);text-shadow:0 0 8px rgba(47,168,255,.5);cursor:default}
.time{color:var(--dim);font-size:11px}
.txt{white-space:pre-wrap;line-height:1.4;font-size:15px}
#users{width:210px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto}
#users h4{color:var(--blue);font-size:13px;margin-bottom:10px}
.u{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green);padding:4px 0;cursor:pointer}
.u .dot{width:7px;height:7px;background:var(--green);color:var(--green)}
@media(max-width:700px){#users{position:absolute;right:0;top:0;bottom:0;z-index:5;transform:translateX(100%);transition:.25s;box-shadow:-10px 0 30px #000}#users.open{transform:none}}
form#send{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
form#send input{flex:1}
.cnt{position:absolute;right:92px;bottom:max(14px,calc(env(safe-area-inset-bottom) + 4px));font-size:10px;color:var(--dim);pointer-events:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1a0a0e;border:1px solid var(--err);color:var(--err);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:.3s;max-width:90%}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
#modal .card{max-width:340px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.row b{color:var(--blue)}
</style>
</head>
<body>
<div id="app">
  <div id="loader"><div class="logo">Ghost<span>Link</span></div><div class="spin"></div><div class="sub" id="loadtxt">Bağlanıyor</div></div>

  <div id="login" class="hidden">
    <div class="card">
      <div class="logo">Ghost<span>Link</span></div>
      <div class="sub">anonim. gerçek zamanlı. izsiz</div>
      <input id="nick" type="text" maxlength="20" placeholder="kullanıcı adı seç" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="hint">3–20 karakter: harf, rakam, alt çizgi (_)</div>
      <button id="join" class="btn full">Katıl</button>
      <div id="loginerr" class="err"></div>
    </div>
  </div>

  <div id="chat" class="hidden">
    <header>
      <div class="logo">Ghost<span>Link</span></div>
      <div class="grow"></div>
      <div class="status"><span class="dot" id="conn"></span><span id="conntxt">bağlanıyor</span></div>
      <button class="iconbtn" id="usersBtn">● <span id="onlineCount">0</span></button>
    </header>
    <div id="rooms"></div>
    <div id="main">
      <div id="msgs"></div>
      <aside id="users"><h4>ÇEVRİMİÇİ</h4><div id="ulist"></div></aside>
    </div>
    <form id="send" autocomplete="off">
      <input id="msgin" type="text" maxlength="2000" placeholder="mesaj yaz...">
      <span class="cnt" id="cnt"></span>
      <button class="btn" id="sendbtn" type="submit">Gönder</button>
    </form>
  </div>
</div>
<div id="toast"></div>
<div id="modal" class="hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,writeBatch,collection,query,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== BURAYA KENDİ FIREBASE AYARLARINI YAPIŞTIR ====== */
const firebaseConfig = {
  apiKey: "BURAYA",
  authDomain: "BURAYA.firebaseapp.com",
  projectId: "BURAYA",
  storageBucket: "BURAYA.appspot.com",
  messagingSenderId: "BURAYA",
  appId: "BURAYA"
};
/* ======================================================== */

const ROOMS=[
  {id:"general",name:"General"},
  {id:"security",name:"Cyber Security"},
  {id:"linux",name:"Linux"},
  {id:"programming",name:"Programming"},
  {id:"technology",name:"Technology"}
];
const NAME_RE=/^[A-Za-z0-9_]{3,20}$/;
const MAX_LEN=2000, COOLDOWN=1200, ONLINE_MS=75000;

const $=id=>document.getElementById(id);
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let me=null;            // {uid, username, createdAt}
let room="general";
let unsubMsgs=null, unsubUsers=null, hb=null, lastSent=0;
let allUsers=[];

/* ---------- yardımcılar ---------- */
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3500)}
function errText(e){
  const c=(e&&e.code)||"";
  if(c.includes("permission-denied"))return "İşlem reddedildi (çok hızlı mesaj, geçersiz veri ya da kullanıcı adı alınmış).";
  if(c.includes("unavailable")||c.includes("network"))return "Bağlantı yok. İnternetini kontrol et.";
  if(c.includes("operation-not-allowed")||c.includes("admin-restricted"))return "Firebase'de Anonymous giriş kapalı. Console'dan aç.";
  if(c.includes("unauthorized-domain"))return "Bu alan adı Firebase'de yetkili değil (Authorized domains).";
  if(c.includes("api-key"))return "Firebase apiKey hatalı. firebaseConfig'i kontrol et.";
  return "Bir hata oluştu: "+(c||e.message||e);
}
function fmtTime(ts){
  if(!ts)return "…";
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}
function fmtDate(ts){
  if(!ts)return "-";
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"});
}
function show(id){["loader","login","chat"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}

/* ---------- başlangıç ---------- */
onAuthStateChanged(auth,async user=>{
  if(!user){
    try{await signInAnonymously(auth)}catch(e){show("login");$("loginerr").textContent=errText(e)}
    return;
  }
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(snap.exists()){
      me={uid:user.uid,...snap.data()};
      startChat();
    }else{
      show("login");
      $("nick").focus();
    }
  }catch(e){
    show("login");$("loginerr").textContent=errText(e);
  }
});

/* ---------- giriş / kullanıcı adı ---------- */
$("join").onclick=join;
$("nick").addEventListener("keydown",e=>{if(e.key==="Enter")join()});
async function join(){
  const name=$("nick").value.trim();
  const err=$("loginerr");err.textContent="";
  if(!NAME_RE.test(name)){err.textContent="Kullanıcı adı 3–20 karakter olmalı; sadece harf, rakam ve _ kullanılabilir.";return}
  if(name.toLowerCase()==="ghostlink"){err.textContent="Bu ad ayrılmış.";return}
  const user=auth.currentUser;
  if(!user){err.textContent="Kimlik doğrulama bekleniyor, tekrar dene.";return}
  $("join").disabled=true;
  try{
    const key=name.toLowerCase();
    const taken=await getDoc(doc(db,"usernames",key));
    if(taken.exists()){err.textContent="Bu kullanıcı adı zaten alınmış.";$("join").disabled=false;return}
    const b=writeBatch(db);
    b.set(doc(db,"usernames",key),{uid:user.uid});
    b.set(doc(db,"users",user.uid),{username:name,createdAt:serverTimestamp(),lastSeen:serverTimestamp()});
    await b.commit();   // sunucu kuralları benzersizliği tekrar doğrular
    const snap=await getDoc(doc(db,"users",user.uid));
    me={uid:user.uid,...snap.data()};
    startChat();
  }catch(e){
    err.textContent=errText(e);
  }
  $("join").disabled=false;
}

/* ---------- sohbet ---------- */
function startChat(){
  show("chat");
  buildRooms();
  switchRoom("general");
  startPresence();
  watchConnection();
  $("msgin").focus();
}

function buildRooms(){
  const box=$("rooms");box.innerHTML="";
  ROOMS.forEach(r=>{
    const b=document.createElement("button");
    b.className="room";b.dataset.id=r.id;b.textContent="# "+r.name;
    b.onclick=()=>switchRoom(r.id);
    box.appendChild(b);
  });
}

function switchRoom(id){
  room=id;
  document.querySelectorAll(".room").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(unsubMsgs)unsubMsgs();
  const box=$("msgs");box.innerHTML="";
  addSystem("# "+ROOMS.find(r=>r.id===id).name+" odasına hoş geldin, "+me.username+".");
  const q=query(collection(db,"rooms",id,"messages"),orderBy("ts","desc"),limit(100));
  let first=true;
  unsubMsgs=onSnapshot(q,snap=>{
    const docs=snap.docs.slice().reverse();
    const sys=box.firstChild;
    box.innerHTML="";
    if(sys)box.appendChild(sys);
    docs.forEach(d=>box.appendChild(renderMsg(d.data())));
    box.style.scrollBehavior=first?"auto":"smooth";
    box.scrollTop=box.scrollHeight;
    first=false;
  },e=>toast(errText(e)));
}

function addSystem(t){
  const d=document.createElement("div");d.className="msg sys";
  const m=document.createElement("div");m.className="meta";m.style.justifyContent="center";
  const n=document.createElement("span");n.className="uname gl";n.textContent="GhostLink";
  m.appendChild(n);
  const x=document.createElement("div");x.className="txt";x.textContent=t;
  d.append(m,x);
  $("msgs").appendChild(d);
}

function renderMsg(m){
  const d=document.createElement("div");
  d.className="msg"+(m.uid===me.uid?" me":"");
  const meta=document.createElement("div");meta.className="meta";
  const n=document.createElement("span");
  n.className="uname"+(m.username==="GhostLink"?" gl":"");
  n.textContent=m.username;           // textContent = XSS güvenli
  n.onclick=()=>openProfile(m.uid,m.username);
  const t=document.createElement("span");t.className="time";t.textContent=fmtTime(m.ts);
  meta.append(n,t);
  const x=document.createElement("div");x.className="txt";x.textContent=m.text;
  d.append(meta,x);
  return d;
}

/* ---------- mesaj gönderme ---------- */
$("msgin").addEventListener("input",()=>{
  const l=$("msgin").value.length;
  $("cnt").textContent=l>1500?l+"/"+MAX_LEN:"";
});
$("send").addEventListener("submit",async e=>{
  e.preventDefault();
  const input=$("msgin");
  const text=input.value.trim();
  if(!text){toast("Boş mesaj gönderilemez.");return}
  if(text.length>MAX_LEN){toast("Mesaj en fazla "+MAX_LEN+" karakter olabilir.");return}
  const now=Date.now();
  if(now-lastSent<COOLDOWN){toast("Çok hızlı! Biraz yavaşla.");return}
  lastSent=now;
  input.value="";$("cnt").textContent="";
  try{
    const b=writeBatch(db);
    b.set(doc(collection(db,"rooms",room,"messages")),{uid:me.uid,username:me.username,text,ts:serverTimestamp()});
    b.update(doc(db,"users",me.uid),{lastMsg:serverTimestamp()});
    await b.commit();
  }catch(err){
    input.value=text;
    toast(errText(err));
  }
  input.focus();
});

/* ---------- çevrimiçi takibi ---------- */
function startPresence(){
  const beat=()=>{
    if(document.hidden)return;
    const b=writeBatch(db);
    b.update(doc(db,"users",me.uid),{lastSeen:serverTimestamp()});
    b.commit().catch(()=>{});
  };
  beat();
  hb=setInterval(beat,30000);
  document.addEventListener("visibilitychange",beat);
  const q=query(collection(db,"users"),orderBy("lastSeen","desc"),limit(200));
  unsubUsers=onSnapshot(q,snap=>{
    allUsers=snap.docs.map(d=>({uid:d.id,...d.data()}));
    renderUsers();
  },()=>{});
  setInterval(renderUsers,15000);
}
function renderUsers(){
  const cut=Date.now()-ONLINE_MS;
  const on=allUsers.filter(u=>u.lastSeen&&u.lastSeen.toMillis&&u.lastSeen.toMillis()>cut);
  $("onlineCount").textContent=on.length;
  const box=$("ulist");box.innerHTML="";
  on.forEach(u=>{
    const r=document.createElement("div");r.className="u";
    const d=document.createElement("span");d.className="dot";
    const n=document.createElement("span");n.textContent=u.username;
    r.append(d,n);
    r.onclick=()=>openProfile(u.uid,u.username);
    box.appendChild(r);
  });
}
$("usersBtn").onclick=()=>$("users").classList.toggle("open");

/* ---------- bağlantı durumu ---------- */
function watchConnection(){
  const set=()=>{
    const on=navigator.onLine;
    $("conn").classList.toggle("on",on);
    $("conntxt").textContent=on?"bağlı":"çevrimdışı";
  };
  window.addEventListener("online",set);
  window.addEventListener("offline",set);
  set();
}

/* ---------- profil ---------- */
function openProfile(uid,name){
  const u=allUsers.find(x=>x.uid===uid)||(uid===me.uid?me:null);
  const m=$("modal");m.innerHTML="";m.classList.remove("hidden");
  const c=document.createElement("div");c.className="card";
  const h=document.createElement("div");h.className="logo";h.style.fontSize="22px";h.textContent=name;
  c.appendChild(h);
  const rows=[
    ["Kimlik",uid.slice(0,10)+"…"],
    ["Katılım",u?fmtDate(u.createdAt):"-"],
    ["Durum",u&&u.lastSeen&&u.lastSeen.toMillis&&u.lastSeen.toMillis()>Date.now()-ONLINE_MS?"çevrimiçi":"çevrimdışı"]
  ];
  rows.forEach(([k,v])=>{
    const r=document.createElement("div");r.className="row";
    const a=document.createElement("span");a.textContent=k;
    const b=document.createElement("b");b.textContent=v;
    r.append(a,b);c.appendChild(r);
  });
  const x=document.createElement("button");x.className="btn full";x.textContent="Kapat";
  x.onclick=()=>m.classList.add("hidden");
  c.appendChild(x);m.appendChild(c);
  m.onclick=e=>{if(e.target===m)m.classList.add("hidden")};
}
</script>
</body>
</html>
