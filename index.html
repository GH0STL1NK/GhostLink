<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostLink - Terminal Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Yazılara tıklandığında kopyalama/seçilme sorununu ve mavi işareti önler */
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #0b0e14;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Giriş Ekranı */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            border: 1px solid #00ff66;
            padding: 30px;
            width: 320px;
            background: #111622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            background: #05070a;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: #00ff66;
            border: none;
            color: #0b0e14;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-box button:hover {
            background: #00cc52;
            box-shadow: 0 0 10px #00ff66;
        }

        /* Ana Uygulama */
        #app-container {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #111622;
            border-bottom: 1px solid #00ff66;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rooms {
            display: flex;
            gap: 10px;
        }

        .room-btn {
            background: transparent;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 5px 12px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        .room-btn.active {
            background: #00ff66;
            color: #0b0e14;
            font-weight: bold;
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: #111622;
            border-left: 3px solid #00ff66;
            padding: 10px;
            font-size: 14px;
            word-break: break-all;
        }

        .message .username {
            font-weight: bold;
            margin-right: 8px;
        }

        /* Admin Kullanıcı Rengi ve Stili */
        .message .username.admin-user {
            color: #00bfff !important; /* Mavi renk */
            text-shadow: 0 0 5px rgba(0, 191, 255, 0.5);
        }

        .admin-badge {
            font-size: 11px;
            background: #00bfff;
            color: #0b0e14;
            padding: 1px 4px;
            margin-left: 5px;
            font-weight: bold;
        }

        .input-area {
            padding: 15px;
            background: #111622;
            border-top: 1px solid #00ff66;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            background: #05070a;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
        }

        .input-area button {
            padding: 10px 20px;
            background: #00ff66;
            border: none;
            color: #0b0e14;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }

        .input-area button:hover {
            background: #00cc52;
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI (Sadece İsim İster) -->
    <div id="login-screen">
        <div class="login-box">
            <h2>GHOSTLINK</h2>
            <input type="text" id="username-input" placeholder="İsminizi yazın..." autocomplete="off">
            <button onclick="enterChat()">GİRİŞ YAP</button>
        </div>
    </div>

    <!-- SOHBET EKRANI -->
    <div id="app-container">
        <header>
            <div class="rooms">
                <button class="room-btn active" onclick="switchRoom('General')">#General</button>
                <button class="room-btn" onclick="switchRoom('Cyber Security')">#CyberSecurity</button>
                <button class="room-btn" onclick="switchRoom('Linux')">#Linux</button>
            </div>
            <div id="current-user-display" style="font-size: 13px; color: #888;"></div>
        </header>

        <div class="chat-area" id="chat-messages">
            <!-- Mesajlar buraya gelecek -->
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Mesajını yaz..." onkeypress="checkEnter(event)" autocomplete="off">
            <button onclick="sendMessage()">GÖNDER</button>
        </div>
    </div>

    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // BURAYA KENDİ FIREBASE YAPILANDIRMANI YAPIŞTIRMALISIN
        const firebaseConfig = {
            apiKey: "SENIN_API_KEY",
            authDomain: "SENIN_AUTH_DOMAIN",
            projectId: "SENIN_PROJECT_ID",
            storageBucket: "SENIN_STORAGE_BUCKET",
            messagingSenderId: "SENIN_MESSAGING_SENDER_ID",
            appId: "SENIN_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUsername = "";
        let currentRoom = "General";
        let unsubscribeMessages = null;

        // Admin olarak tanınacak isim (Bunu kendi isminle değiştirebilirsin)
        const ADMIN_NAME = "Admin"; 

        window.enterChat = async function() {
            const inputVal = document.getElementById("username-input").value.trim();
            if (!inputVal) {
                alert("Lütfen bir isim girin!");
                return;
            }

            currentUsername = inputVal;

            try {
                // E-posta/şifre sormadan doğrudan Firebase Anonim Oturumu açıyoruz
                await signInAnonymously(auth);
                
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-container").style.display = "flex";
                document.getElementById("current-user-display").innerText = `Kullanıcı: ${currentUsername}`;
                
                loadMessages();
            } catch (error) {
                console.error("Giriş hatası:", error);
                alert("Bağlantı hatası oluştu.");
            }
        };

        window.sendMessage = async function() {
            const msgInput = document.getElementById("message-input");
            const text = msgInput.value.trim();
            if (!text || !currentUsername) return;

            // İsmin tam olarak admin adına eşit olup olmadığını kontrol et
            const isAdmin = (currentUsername === ADMIN_NAME);

            try {
                await addDoc(collection(db, "chats", currentRoom, "messages"), {
                    username: currentUsername,
                    text: text,
                    isAdmin: isAdmin,
                    createdAt: serverTimestamp()
                });
                msgInput.value = "";
            } catch (error) {
                console.error("Mesaj gönderme hatası:", error);
            }
        };

        window.checkEnter = function(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        };

        window.switchRoom = function(roomName) {
            currentRoom = roomName;
            
            // Buton aktiflik sınıflarını değiştir
            document.querySelectorAll('.room-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(roomName)) {
                    btn.classList.add('active');
                }
            });

            loadMessages();
        };

        function loadMessages() {
            const chatContainer = document.getElementById("chat-messages");
            chatContainer.innerHTML = "";

            if (unsubscribeMessages) {
                unsubscribeMessages(); // Önceki dinleyiciyi kapat
            }

            const q = query(collection(db, "chats", currentRoom, "messages"), orderBy("createdAt", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatContainer.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const msgDiv = document.createElement("div");
                    msgDiv.className = "message";

                    const nameSpan = document.createElement("span");
                    nameSpan.className = "username";
                    nameSpan.innerText = data.username + ":";

                    // Admin kontrolü (Tıpatıp aynıysa mavi renk ve rozet ekle)
                    if (data.username === ADMIN_NAME || data.isAdmin) {
                        nameSpan.classList.add("admin-user");
                        nameSpan.innerHTML = `${data.username} <span class="admin-badge">ADMIN</span>:`;
                    }

                    const textSpan = document.createElement("span");
                    textSpan.innerText = " " + data.text;

                    msgDiv.appendChild(nameSpan);
                    msgDiv.appendChild(textSpan);
                    chatContainer.appendChild(msgDiv);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }
    </script>
</body>
</html>
