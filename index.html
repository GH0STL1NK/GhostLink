<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostLink // Secure Terminal v2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0f0b; color: #00ff66; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050705; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { border: 1px solid #00ff66; padding: 30px; background: #0b0f0b; text-align: center; box-shadow: 0 0 25px rgba(0, 255, 102, 0.15); width: 380px; }
        .auth-box h2 { margin-bottom: 10px; font-size: 22px; letter-spacing: 3px; }
        .auth-box p { font-size: 11px; color: #00aa44; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 12px; background: #000; border: 1px solid #00ff66; color: #00ff66; margin-bottom: 15px; outline: none; text-align: center; font-size: 15px; }
        .auth-box input::placeholder { color: #005522; }
        .auth-box button { width: 100%; padding: 12px; background: #00ff66; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s; }
        .auth-box button:hover { background: #00cc52; }
        #auth-error { color: #ff3333; font-size: 12px; margin-top: 12px; min-height: 16px; }

        /* ANA UYGULAMA */
        #app-container { display: none; height: 100vh; flex-direction: row; }
        
        /* SIDEBAR (ODALAR) */
        sidebar { width: 260px; background: #070a07; border-right: 1px solid #1a331a; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-header { padding: 20px; font-size: 18px; border-bottom: 1px solid #1a331a; font-weight: bold; letter-spacing: 1px; }
        .room-list { list-style: none; padding: 10px 0; }
        .room-item { padding: 14px 20px; cursor: pointer; color: #00aa44; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .room-item:hover { background: #0f1a0f; color: #00ff66; }
        .room-item.active { background: #142614; color: #00ff66; border-left: 3px solid #00ff66; }
        
        /* Admin Odası Özel Stili */
        .room-item.admin-room { color: #3399ff; border-top: 1px solid #1a2633; margin-top: 10px; }
        .room-item.admin-room:hover { background: #0a141f; color: #66b3ff; }
        .room-item.admin-room.active { background: #0f1f33; color: #66b3ff; border-left: 3px solid #3399ff; }

        .user-status-bar { padding: 15px 20px; border-top: 1px solid #1a331a; font-size: 12px; background: #050705; }
        .logout-btn { margin-top: 8px; background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 4px 8px; font-size: 11px; cursor: pointer; width: 100%; }
        .logout-btn:hover { background: #ff3333; color: #000; }

        /* CHAT ALANI */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b0f0b; }
        .chat-header { padding: 20px; border-bottom: 1px solid #1a331a; font-size: 16px; background: #070a07; display: flex; justify-content: space-between; align-items: center; }
        .room-desc { font-size: 12px; color: #008833; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { background: #0f170f; border: 1px solid #1a331a; padding: 12px; max-width: 75%; word-break: break-word; border-radius: 2px; }
        .message.admin-msg { border-color: #1a334d; background: #0b1117; }
        
        /* İSİM RENKLERİ */
        .name-admin { color: #3399ff !important; font-weight: bold; }
        .name-user { color: #00ff66 !important; font-weight: bold; }
        
        .message .user-header { font-size: 12px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
        .badge-admin { background: #003366; color: #66b3ff; padding: 1px 5px; font-size: 10px; border: 1px solid #3399ff; }
        .message .text { font-size: 14px; color: #e0ffe0; line-height: 1.4; }
        .message .time { font-size: 10px; color: #006622; margin-top: 6px; text-align: right; }

        /* MESAJ GÖNDERME ÇUBUĞU */
        .chat-input-area { padding: 20px; background: #070a07; border-top: 1px solid #1a331a; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; background: #000; border: 1px solid #1a331a; color: #00ff66; outline: none; }
        .chat-input-area input:focus { border-color: #00ff66; }
        .chat-input-area input:disabled { background: #0a0a0a; border-color: #331111; color: #aa3333; cursor: not-allowed; }
        .chat-input-area button { padding: 0 25px; background: #00ff66; color: #000; border: none; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        .chat-input-area button:hover:not(:disabled) { background: #00cc52; }
        .chat-input-area button:disabled { background: #222; color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>// GHOSTLINK_</h2>
            <p>SECURE TERMINAL ACCESS</p>
            <input type="text" id="username-input" placeholder="Rumuz (Büyük/küçük harf duyarlı)" autocomplete="off">
            <input type="password" id="code-input" placeholder="Erişim Kodu (Access Code)" autocomplete="off" onkeypress="if(event.key==='Enter') loginUser()">
            <button onclick="loginUser()">SİSTEME BAĞLAN</button>
            <div id="auth-error"></div>
        </div>
    </div>

    <!-- ANA PLATFORM -->
    <div id="app-container">
        <sidebar>
            <div>
                <div class="sidebar-header">// KANALLAR</div>
                <ul class="room-list" id="room-list">
                    <li class="room-item active" onclick="switchRoom('general', this)">
                        <span># genel-sohbet</span>
                    </li>
                    <li class="room-item" onclick="switchRoom('announcements', this)">
                        <span># duyurular</span>
                    </li>
                    <!-- Sadece Yöneticiler İçin Görünür -->
                    <li class="room-item admin-room" id="admin-room-btn" style="display: none;" onclick="switchRoom('admin_hq', this)">
                        <span># yonetici-odasi</span>
                    </li>
                </ul>
            </div>

            <div class="user-status-bar">
                <div>Bağlı: <span id="display-username"></span></div>
                <div>Yetki: <span id="display-role"></span></div>
                <button class="logout-btn" onclick="logoutUser()">OTURUMU KAPAT</button>
            </div>
        </sidebar>

        <div class="chat-area">
            <div class="chat-header">
                <span id="current-room-title"># genel-sohbet</span>
                <span class="room-desc" id="current-room-desc">Herkes mesaj yazabilir ve okuyabilir.</span>
            </div>
            <div class="messages-container" id="messages"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Mesajınızı yazın..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">GÖNDER</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore";

        // KENDİ FIREBASE BİLGİLERİNİ BURAYA GİR
        const firebaseConfig = {
            apiKey: "SENIN_API_KEY",
            authDomain: "SENIN_AUTH_DOMAIN",
            projectId: "SENIN_PROJECT_ID",
            storageBucket: "SENIN_STORAGE_BUCKET",
            messagingSenderId: "SENIN_MESSAGING_SENDER_ID",
            appId: "SENIN_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==========================================
        // ERİŞİM KODLARI (KENDİNE GÖRE DÜZENLEYEBİLİRSİN)
        // ==========================================
        const ACCESS_CODES = {
            // Yönetici Kodları (Mavi İsim + Admin Odası + Duyuru Yetkisi)
            "ROOT-999": "admin",
            "ADMIN-007": "admin",
            
            // Normal Kullanıcı Kodları (Yeşil İsim + Genel Sohbet)
            "GHOST-101": "user",
            "GHOST-102": "user",
            "USER-2026": "user"
        };

        let currentUser = null;
        let currentRole = null; // 'admin' veya 'user'
        let currentRoom = "general";
        let unsubscribeMessages = null;

        // SİSTEME GİRİŞ
        window.loginUser = async function() {
            const rawName = document.getElementById('username-input').value.trim();
            const accessCode = document.getElementById('code-input').value.trim();
            const errorBox = document.getElementById('auth-error');
            errorBox.innerText = "";

            if (!rawName || !accessCode) {
                errorBox.innerText = "HATA: Rumuz ve Erişim Kodu zorunludur.";
                return;
            }

            // 1. Kod Doğrulama
            if (!ACCESS_CODES.hasOwnProperty(accessCode)) {
                errorBox.innerText = "ERİŞİM REDDEDİLDİ: Geçersiz erişim kodu!";
                return;
            }

            const assignedRole = ACCESS_CODES[accessCode];

            try {
                // Firebase Anonim Kimlik Doğrulama
                await signInAnonymously(auth);

                // 2. İsim Benzersizlik Kontrolü ("Anonim" !== "anonim")
                // Firestore doküman ID'si tam olarak kullanıcının yazdığı string olur.
                // Bu sayede "Anonim" ve "anonim" iki farklı doküman ID'si olarak ayrı tutulur.
                const userDocRef = doc(db, "active_users", rawName);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    errorBox.innerText = `HATA: "${rawName}" ismi şu anda kullanımda! Farklı bir isim seçin.`;
                    return;
                }

                // İsmi aktif kullanıcılar listesine kaydet
                await setDoc(userDocRef, {
                    username: rawName,
                    role: assignedRole,
                    joinedAt: serverTimestamp()
                });

                currentUser = rawName;
                currentRole = assignedRole;

                // Sayfa kapatıldığında ismi serbest bırakmaya çalış
                window.addEventListener("beforeunload", () => {
                    deleteDoc(doc(db, "active_users", currentUser));
                });

                setupUI();
            } catch (error) {
                console.error("Giriş Hatası:", error);
                errorBox.innerText = "Sistem bağlantı hatası: " + error.message;
            }
        };

        // ARAYÜZÜ YETKİYE GÖRE HAZIRLA
        function setupUI() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';

            const nameSpan = document.getElementById('display-username');
            const roleSpan = document.getElementById('display-role');

            nameSpan.innerText = currentUser;

            if (currentRole === 'admin') {
                nameSpan.className = 'name-admin';
                roleSpan.innerText = 'YÖNETİCİ (ADMIN)';
                roleSpan.style.color = '#3399ff';
                // Yönetici odasını görünür yap
                document.getElementById('admin-room-btn').style.display = 'flex';
            } else {
                nameSpan.className = 'name-user';
                roleSpan.innerText = 'ÜYE (USER)';
                roleSpan.style.color = '#00ff66';
                document.getElementById('admin-room-btn').style.display = 'none';
            }

            switchRoom('general', document.querySelector('.room-item.active'));
        }

        // ODA DEĞİŞTİRME
        window.switchRoom = function(roomName, element) {
            // Güvenlik Kontrolü: Normal kullanıcı admin odasına geçmeye çalışırsa engelle
            if (roomName === 'admin_hq' && currentRole !== 'admin') {
                alert("YETKİSİZ ERİŞİM: Bu odaya sadece yöneticiler girebilir.");
                return;
            }

            currentRoom = roomName;
            document.querySelectorAll('.room-item').forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');

            const titleEl = document.getElementById('current-room-title');
            const descEl = document.getElementById('current-room-desc');
            const msgInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');

            // Oda başlıkları ve yazma yetkileri
            if (roomName === 'general') {
                titleEl.innerText = "# genel-sohbet";
                titleEl.style.color = "#00ff66";
                descEl.innerText = "Tüm üyeler ve yöneticiler mesajlaşabilir.";
                msgInput.disabled = false;
                sendBtn.disabled = false;
                msgInput.placeholder = "Genel sohbete mesaj yazın...";
            } 
            else if (roomName === 'announcements') {
                titleEl.innerText = "# duyurular";
                titleEl.style.color = "#ffcc00";
                descEl.innerText = "Operasyon ve sistem duyuruları (Sadece yöneticiler yazabilir).";
                
                if (currentRole === 'admin') {
                    msgInput.disabled = false;
                    sendBtn.disabled = false;
                    msgInput.placeholder = "Tüm kullanıcılara duyuru yayınlayın...";
                } else {
                    msgInput.disabled = true;
                    sendBtn.disabled = true;
                    msgInput.placeholder = "Bu kanala sadece yöneticiler duyuru yazabilir.";
                }
            } 
            else if (roomName === 'admin_hq') {
                titleEl.innerText = "# yonetici-odasi";
                titleEl.style.color = "#3399ff";
                descEl.innerText = "Gizli kanal: Sadece yöneticiler görebilir ve yazabilir.";
                msgInput.disabled = false;
                sendBtn.disabled = false;
                msgInput.placeholder = "Yöneticiler arası gizli mesaj yazın...";
            }

            loadMessages(roomName);
        };

        // MESAJLARI VERİTABANINDAN DİNLEME
        function loadMessages(roomName) {
            const messagesContainer = document.getElementById('messages');
            messagesContainer.innerHTML = "";

            if (unsubscribeMessages) {
                unsubscribeMessages();
            }

            const q = query(collection(db, "channels", roomName, "messages"), orderBy("timestamp", "asc"));

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const msgDiv = document.createElement('div');
                    const isMsgAdmin = data.role === 'admin';
                    
                    msgDiv.className = isMsgAdmin ? 'message admin-msg' : 'message';
                    
                    const timeStr = data.timestamp 
                        ? new Date(data.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
                        : '...';

                    const nameClass = isMsgAdmin ? 'name-admin' : 'name-user';
                    const adminBadge = isMsgAdmin ? '<span class="badge-admin">ADMIN</span>' : '';

                    msgDiv.innerHTML = `
                        <div class="user-header">
                            <span class="${nameClass}">${escapeHtml(data.user)}</span>
                            ${adminBadge}
                        </div>
                        <div class="text">${escapeHtml(data.text)}</div>
                        <div class="time">${timeStr}</div>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // MESAJ GÖNDERME
        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            // Yetki Kontrolü (Frontend Koruması)
            if ((currentRoom === 'announcements' || currentRoom === 'admin_hq') && currentRole !== 'admin') {
                alert("Bu odaya mesaj gönderme yetkiniz yok!");
                return;
            }

            try {
                await addDoc(collection(db, "channels", currentRoom, "messages"), {
                    user: currentUser,
                    role: currentRole,
                    text: text,
                    timestamp: serverTimestamp()
                });
                input.value = "";
            } catch (error) {
                console.error("Mesaj gönderme hatası:", error);
                alert("Mesaj gönderilemedi! Firebase kurallarını kontrol edin.");
            }
        };

        // OTURUMU KAPAT VE İSMİ SERBEST BIRAK
        window.logoutUser = async function() {
            if (currentUser) {
                await deleteDoc(doc(db, "active_users", currentUser));
            }
            location.reload();
        };

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
