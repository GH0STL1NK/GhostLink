
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GhostLink</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090a0f;color:#eee;font-family:Arial,sans-serif}
button,input{font:inherit}
.hidden{display:none!important}
#loginScreen{min-height:100vh;display:grid;place-items:center;padding:18px}
.loginBox{width:100%;max-width:420px;background:#12141c;border:1px solid #292d3a;border-radius:18px;padding:28px}
.logo{text-align:center;color:#ff3030;font-size:34px;font-weight:900;letter-spacing:4px}
.sub{text-align:center;color:#858a98;font-size:12px;margin:10px 0 28px}
h2{text-align:center}
input{width:100%;padding:14px;background:#090a0e;border:1px solid #333744;border-radius:9px;color:white;margin:9px 0;outline:none}
button{cursor:pointer;border:0;border-radius:9px;padding:13px;background:#d71920;color:white;font-weight:bold}
.loginBox button{width:100%;margin-top:10px}
.adminBtn{background:#172b50;color:#65a5ff;border:1px solid #3478ed}
.note{text-align:center;color:#777;font-size:12px;line-height:1.6;margin-top:18px}
.error{color:#ff7777;font-size:13px;margin-top:12px;overflow-wrap:anywhere}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:58px;flex-shrink:0;background:#12141c;border-bottom:1px solid #292d3a;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
header strong{color:#ff3030;letter-spacing:2px}
#logout{background:#272b37;padding:9px 12px;font-size:12px}
.layout{flex:1;min-height:0;display:flex}
.sidebar{width:205px;flex-shrink:0;background:#10121a;border-right:1px solid #292d3a;padding:17px 10px}
.sideTitle{font-size:11px;color:#777f91;font-weight:bold;padding:8px}
.channel{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:transparent;color:#aeb3c0;padding:13px 11px;margin:3px 0;font-weight:normal}
.channel.active{background:#25202a;color:white;border-left:3px solid #ed3030}
.channel .symbol{font-size:17px}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.chatTitle{padding:14px 17px;border-bottom:1px solid #292d3a;background:#10121a}
.chatTitle strong{font-size:16px}
.chatTitle p{font-size:12px;color:#858a98;margin:5px 0 0}
#status{font-size:11px;color:#62cf8c;margin-top:7px}
#messages{flex:1;overflow-y:auto;padding:17px;display:flex;flex-direction:column;gap:12px}
.msg{background:#151923;border:1px solid #292e3a;padding:12px;border-radius:11px;max-width:850px;width:fit-content;min-width:130px;overflow-wrap:anywhere}
.msgTop{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;color:#aeb5c5}
.adminTag{color:#55a0ff;font-weight:900;letter-spacing:1px}
.msgText{white-space:pre-wrap;line-height:1.5;font-size:14px}
.empty{color:#737b8c;text-align:center;margin:auto;font-size:13px}
#sendArea{display:flex;gap:9px;padding:12px;background:#11131a;border-top:1px solid #292d3a}
#sendArea input{margin:0;min-width:0}
#sendArea button{width:85px;flex-shrink:0}
@media(max-width:560px){
 .sidebar{width:125px;padding:12px 5px}
 .channel{font-size:12px;padding:12px 7px;gap:5px}
 .sideTitle{font-size:9px;padding:7px}
 #messages{padding:12px}
}
</style>
</head>
<body>

<section id="loginScreen">
 <div class="loginBox">
  <div class="logo">GHOSTLINK</div>
  <div class="sub">PRIVATE CHAT NETWORK</div>
  <h2>Sohbete Katıl</h2>
  <input id="username" maxlength="24" placeholder="İsmini yaz...">
  <button id="enterBtn">GİR</button>
  <button class="adminBtn" id="adminBtn">ADMIN GİRİŞİ</button>
  <div class="note">Herkes için ücretsiz ve kolay kullanım.<br>E-posta ve şifre gerekmez.</div>
  <div id="error" class="error"></div>
 </div>
</section>

<section id="app" class="hidden">
 <header>
  <strong>GHOSTLINK</strong>
  <div style="display:flex;align-items:center;gap:10px">
   <span id="currentName" style="font-size:12px"></span>
   <button id="logout">ÇIKIŞ</button>
  </div>
 </header>

 <div class="layout">
  <aside class="sidebar">
   <div class="sideTitle">SOHBET KANALLARI</div>

   <button class="channel active" data-channel="general">
    <span class="symbol">#</span> Genel
   </button>

   <button class="channel" data-channel="announcements">
    <span class="symbol">📢</span> Duyurular
   </button>

   <button class="channel hidden" id="adminChannel" data-channel="admin-chat">
    <span class="symbol">🛡</span> Admin Sohbeti
   </button>
  </aside>

  <main class="chat">
   <div class="chatTitle">
    <strong id="channelTitle"># Genel</strong>
    <p id="channelDescription">Herkese açık grup sohbeti</p>
    <div id="status">Bağlanıyor...</div>
   </div>

   <div id="messages">
    <div class="empty">Mesajlar yükleniyor...</div>
   </div>

   <form id="sendArea">
    <input id="messageInput" maxlength="2000" placeholder="Mesaj yaz..." autocomplete="off" required>
    <button type="submit">GÖNDER</button>
   </form>
  </main>
 </div>
</section>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
 getAuth,signInAnonymously,signInWithPopup,
 GoogleAuthProvider,signOut,onAuthStateChanged,
 updateProfile
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
 getFirestore,collection,addDoc,query,where,limit,
 onSnapshot,serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAvoiBmcERGKNEkdXTVbpzyfbqkJn8x0DA",
 authDomain:"ghostlink-f0ea0.firebaseapp.com",
 projectId:"ghostlink-f0ea0",
 storageBucket:"ghostlink-f0ea0.firebasestorage.app",
 messagingSenderId:"420490121530",
 appId:"1:420490121530:web:ec8d4bc44513c50b280003",
 measurementId:"G-BS8HBQQQB3"
};

const ADMIN_EMAIL="mhrrmovamin60@gmail.com";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const $=id=>document.getElementById(id);
let activeChannel="general";
let isAdmin=false;
let stopMessages=null;

const channelInfo={
 general:{
  title:"# Genel",
  description:"Herkese açık grup sohbeti"
 },
 announcements:{
  title:"📢 Duyurular",
  description:"Duyuruları herkes okuyabilir. Yalnızca admin yazabilir."
 },
 "admin-chat":{
  title:"🛡 Admin Sohbeti",
  description:"Yalnızca admin erişebilir."
 }
};

function showError(text){
 $("error").textContent=text;
}

function selectChannel(channel){
 if(channel==="admin-chat" && !isAdmin)return;

 activeChannel=channel;

 document.querySelectorAll(".channel").forEach(btn=>{
  btn.classList.toggle("active",btn.dataset.channel===channel);
 });

 $("channelTitle").textContent=channelInfo[channel].title;
 $("channelDescription").textContent=channelInfo[channel].description;

 const canSend=isAdmin || channel==="general";
 $("messageInput").disabled=!canSend;
 $("sendArea").querySelector("button").disabled=!canSend;
 $("messageInput").placeholder=canSend?
  "Mesaj yaz...":
  "Bu kanalda yalnızca admin mesaj gönderebilir.";

 loadMessages();
}

function loadMessages(){
 if(stopMessages)stopMessages();

 const area=$("messages");
 area.replaceChildren();

 const q=query(
  collection(db,"messages"),
  where("channel","==",activeChannel),
  limit(100)
 );

 $("status").textContent="Mesajlar yükleniyor...";

 stopMessages=onSnapshot(q,snapshot=>{
  area.replaceChildren();

  const docs=snapshot.docs.slice().sort((a,b)=>{
   const ta=a.data().createdAt?.toMillis?.()||0;
   const tb=b.data().createdAt?.toMillis?.()||0;
   return ta-tb;
  });

  if(docs.length===0){
   const empty=document.createElement("div");
   empty.className="empty";
   empty.textContent="Bu kanalda henüz mesaj yok.";
   area.appendChild(empty);
  }

  docs.forEach(item=>{
   const data=item.data();
   const card=document.createElement("div");
   card.className="msg";

   const top=document.createElement("div");
   top.className="msgTop";

   const name=document.createElement("strong");
   name.textContent=data.name||"Kullanıcı";
   top.appendChild(name);

   if(data.isAdmin===true){
    const badge=document.createElement("span");
    badge.className="adminTag";
    badge.textContent="ADMIN";
    top.appendChild(badge);
   }

   const body=document.createElement("div");
   body.className="msgText";
   body.textContent=data.text||"";

   card.append(top,body);
   area.appendChild(card);
  });

  area.scrollTop=area.scrollHeight;
  $("status").textContent="● Canlı bağlantı";
 },error=>{
  $("status").textContent="HATA: "+error.message;
 });
}

function enterApp(user){
 isAdmin=user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();

 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");

 $("currentName").textContent=isAdmin?"🔵 ADMIN":user.displayName||"Kullanıcı";
 $("adminChannel").classList.toggle("hidden",!isAdmin);

 selectChannel("general");
}

// NORMAL USER
$("enterBtn").onclick=async()=>{
 const name=$("username").value.trim();

 if(name.length<3||name.length>24){
  showError("İsim 3 ile 24 karakter arasında olmalı.");
  return;
 }

 if(name.toLowerCase()==="admin"){
  showError("Bu kullanıcı adı kullanılamaz.");
  return;
 }

 try{
  $("enterBtn").disabled=true;
  showError("Giriş yapılıyor...");

  const result=await signInAnonymously(auth);
  await updateProfile(result.user,{displayName:name});
  enterApp(result.user);
  showError("");
 }catch(error){
  showError("Giriş hatası: "+error.message);
 }finally{
  $("enterBtn").disabled=false;
 }
};

// ADMIN GOOGLE LOGIN
$("adminBtn").onclick=async()=>{
 try{
  $("adminBtn").disabled=true;
  showError("Google hesabı kontrol ediliyor...");

  const result=await signInWithPopup(auth,provider);

  if(result.user.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
   await signOut(auth);
   showError("Bu Google hesabının admin yetkisi yok.");
   return;
  }

  enterApp(result.user);
  showError("");
 }catch(error){
  showError("Admin giriş hatası: "+error.message);
 }finally{
  $("adminBtn").disabled=false;
 }
};

// CHANNEL BUTTONS
document.querySelectorAll(".channel").forEach(btn=>{
 btn.onclick=()=>selectChannel(btn.dataset.channel);
});

// SEND MESSAGE
$("sendArea").onsubmit=async event=>{
 event.preventDefault();

 const user=auth.currentUser;
 const text=$("messageInput").value.trim();

 if(!user||!text)return;

 if(activeChannel==="admin-chat"&&!isAdmin)return;
 if(activeChannel==="announcements"&&!isAdmin)return;

 const admin=user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();

 try{
  await addDoc(collection(db,"messages"),{
   uid:user.uid,
   name:admin?"ADMIN":user.displayName||"Kullanıcı",
   isAdmin:admin,
   channel:activeChannel,
   text:text,
   createdAt:serverTimestamp()
  });

  $("messageInput").value="";
 }catch(error){
  alert("Mesaj gönderilemedi: "+error.message);
 }
};

// AUTH STATE
onAuthStateChanged(auth,user=>{
 if(!user){
  if(stopMessages)stopMessages();
  stopMessages=null;
  isAdmin=false;
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  return;
 }

 const admin=user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();

 if(!user.isAnonymous&&!admin){
  signOut(auth);
  showError("Yetkisiz Google hesabı.");
  return;
 }

 enterApp(user);
});

// LOGOUT
$("logout").onclick=async()=>{
 if(stopMessages)stopMessages();
 stopMessages=null;
 await signOut(auth);
};
</script>
</body>
</html>
