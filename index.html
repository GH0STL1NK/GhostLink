
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GhostLink</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#eee;font-family:Arial,sans-serif}
button,input{font:inherit}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:100%;max-width:450px;background:#11131a;border:1px solid #282b36;border-radius:18px;padding:25px}
.logo{text-align:center;font-size:34px;font-weight:900;letter-spacing:4px;color:#f22}
.sub{text-align:center;color:#858a98;font-size:12px;margin:10px 0 28px}
h2{text-align:center;font-size:21px}
input{width:100%;padding:15px;background:#090a0e;border:1px solid #333744;border-radius:9px;color:white;outline:none;margin:10px 0}
input:focus{border-color:#e33}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#d71920;color:white;font-weight:bold;cursor:pointer;margin-top:10px}
button:disabled{opacity:.5}
.adminBtn{background:#172b50;color:#64a4ff;border:1px solid #3478ed}
.note{text-align:center;color:#777;font-size:12px;line-height:1.6;margin-top:18px}
.error{color:#ff7777;font-size:13px;margin-top:12px;white-space:pre-wrap}
.hidden{display:none!important}
#chatScreen{min-height:100vh;display:flex;flex-direction:column}
header{padding:16px;background:#11131a;border-bottom:1px solid #292d39;display:flex;align-items:center;justify-content:space-between}
header strong{color:#f33;letter-spacing:2px}
.headerRight{display:flex;align-items:center;gap:10px}
.headerRight button{width:auto;margin:0;padding:9px 12px;background:#252936;font-size:12px}
#messages{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;max-width:800px;width:100%;margin:auto}
.msg{background:#151821;border:1px solid #282d3a;padding:12px 14px;border-radius:12px;max-width:90%;overflow-wrap:anywhere}
.msgTop{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;color:#9da4b4}
.adminTag{color:#55a0ff;font-weight:900;letter-spacing:1px}
.msgText{white-space:pre-wrap;line-height:1.5}
#sendArea{padding:14px;background:#11131a;border-top:1px solid #292d39;display:flex;gap:9px;max-width:800px;width:100%;margin:auto}
#sendArea input{margin:0;min-width:0}
#sendArea button{width:85px;margin:0}
#status{font-size:12px;color:#9298a8;text-align:center;padding:7px}
</style>
</head>
<body>

<section class="screen" id="loginScreen">
 <div class="panel">
  <div class="logo">GHOSTLINK</div>
  <div class="sub">PRIVATE CHAT NETWORK</div>
  <div id="normalLogin">
   <h2>Sohbete Katıl</h2>
   <input id="username" maxlength="24" minlength="3" placeholder="İsmini yaz..." autocomplete="nickname">
   <button id="enterBtn">GİR</button>
   <button class="adminBtn" id="adminBtn">ADMIN GİRİŞİ</button>
   <div class="note">Herkes için ücretsiz ve kolay kullanım.<br>Normal girişte e-posta veya şifre gerekmez.</div>
  </div>
  <div id="loginError" class="error"></div>
 </div>
</section>

<section id="chatScreen" class="hidden">
 <header>
  <strong>GHOSTLINK</strong>
  <div class="headerRight">
   <span id="currentName"></span>
   <button id="logoutBtn">ÇIKIŞ</button>
  </div>
 </header>
 <div id="status">Sohbet yükleniyor...</div>
 <main id="messages"></main>
 <form id="sendArea">
  <input id="messageInput" maxlength="2000" placeholder="Mesajını yaz..." autocomplete="off" required>
  <button type="submit">GÖNDER</button>
 </form>
</section>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
 getAuth, signInAnonymously, GoogleAuthProvider,
 signInWithPopup, signOut, onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
 getFirestore, collection, addDoc, query, orderBy,
 limit, onSnapshot, serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
 updateProfile
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyAvoiBmcERGKNEkdXTVbpzyfbqkJn8x0DA",
 authDomain: "ghostlink-f0ea0.firebaseapp.com",
 projectId: "ghostlink-f0ea0",
 storageBucket: "ghostlink-f0ea0.firebasestorage.app",
 messagingSenderId: "420490121530",
 appId: "1:420490121530:web:ec8d4bc44513c50b280003",
 measurementId: "G-BS8HBQQQB3"
};

const ADMIN_EMAIL = "mhrrmovamin60@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const $ = id => document.getElementById(id);
let unsubscribeMessages = null;
let currentUserIsAdmin = false;

function showError(text){
 $("loginError").textContent = text;
}

function showChat(){
 $("loginScreen").classList.add("hidden");
 $("chatScreen").classList.remove("hidden");
}

function showLogin(){
 $("chatScreen").classList.add("hidden");
 $("loginScreen").classList.remove("hidden");
}

function startMessages(){
 if(unsubscribeMessages) unsubscribeMessages();

 const q = query(
  collection(db,"messages"),
  orderBy("createdAt","asc"),
  limit(100)
 );

 unsubscribeMessages = onSnapshot(q,snapshot=>{
  const area = $("messages");
  area.replaceChildren();

  snapshot.forEach(item=>{
   const data = item.data();

   const card = document.createElement("div");
   card.className = "msg";

   const top = document.createElement("div");
   top.className = "msgTop";

   const name = document.createElement("strong");
   name.textContent = data.name || "Kullanıcı";
   top.appendChild(name);

   if(data.isAdmin === true){
    const badge = document.createElement("span");
    badge.className = "adminTag";
    badge.textContent = "ADMIN";
    top.appendChild(badge);
   }

   const body = document.createElement("div");
   body.className = "msgText";
   body.textContent = data.text || "";

   card.append(top,body);
   area.appendChild(card);
  });

  area.scrollTop = area.scrollHeight;
  $("status").textContent = "● Canlı sohbet";
 },error=>{
  $("status").textContent = "Sohbet yüklenemedi: " + error.message;
 });
}

// NORMAL USER LOGIN
$("enterBtn").onclick = async()=>{
 const name = $("username").value.trim();

 if(name.length < 3 || name.length > 24){
  showError("İsim 3-24 karakter arasında olmalı.");
  return;
 }

 if(name.toUpperCase() === "ADMIN"){
  showError("Bu isim kullanılamaz.");
  return;
 }

 try{
  $("enterBtn").disabled = true;
  showError("Giriş yapılıyor...");

  const result = await signInAnonymously(auth);
  await updateProfile(result.user,{displayName:name});
  currentUserIsAdmin = false;
 }catch(error){
  showError("Giriş hatası: " + error.message);
 }finally{
  $("enterBtn").disabled = false;
 }
};

// ADMIN GOOGLE LOGIN
$("adminBtn").onclick = async()=>{
 try{
  $("adminBtn").disabled = true;
  showError("Google hesabı doğrulanıyor...");

  const result = await signInWithPopup(auth,provider);
  const email = result.user.email?.toLowerCase();

  if(email !== ADMIN_EMAIL.toLowerCase()){
   await signOut(auth);
   showError("Bu Google hesabının admin yetkisi yok.");
   return;
  }

  currentUserIsAdmin = true;
 }catch(error){
  showError("Admin giriş hatası: " + error.message);
 }finally{
  $("adminBtn").disabled = false;
 }
};

// AUTH STATE
onAuthStateChanged(auth,user=>{
 if(!user){
  currentUserIsAdmin = false;
  if(unsubscribeMessages) unsubscribeMessages();
  unsubscribeMessages = null;
  showLogin();
  return;
 }

 const isAdmin = user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

 if(!user.isAnonymous && !isAdmin){
  signOut(auth);
  showError("Yetkisiz hesap.");
  return;
 }

 currentUserIsAdmin = isAdmin;
 $("currentName").textContent = isAdmin ? "ADMIN" : (user.displayName || "Kullanıcı");
 showChat();
 startMessages();
});

// SEND MESSAGE
$("sendArea").addEventListener("submit",async event=>{
 event.preventDefault();

 const text = $("messageInput").value.trim();
 const user = auth.currentUser;

 if(!user || !text) return;

 const isAdmin = user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

 try{
  await addDoc(collection(db,"messages"),{
   uid:user.uid,
   name:isAdmin ? "ADMIN" : (user.displayName || "Kullanıcı"),
   isAdmin:isAdmin,
   text:text,
   createdAt:serverTimestamp()
  });

  $("messageInput").value = "";
 }catch(error){
  alert("Mesaj gönderilemedi: " + error.message);
 }
});

// LOGOUT
$("logoutBtn").onclick = async()=>{
 if(unsubscribeMessages) unsubscribeMessages();
 unsubscribeMessages = null;
 await signOut(auth);
};
</script>
</body>
</html>
