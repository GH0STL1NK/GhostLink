
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhostLink Network</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #030806;
  color: #00ff80;
  font-family: monospace;
  min-height: 100vh;
}

header {
  padding: 24px 12px;
  text-align: center;
  background: #07130c;
  border-bottom: 1px solid #00ff8055;
}

header h1 {
  font-size: 32px;
  letter-spacing: 5px;
  text-shadow: 0 0 15px #00ff80;
}

header p {
  color: #548b68;
  margin-top: 8px;
}

.container {
  max-width: 900px;
  margin: 25px auto;
  padding: 12px;
}

.panel {
  background: #08110c;
  border: 1px solid #00ff8044;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 0 20px #00ff8010;
}

h2, h3 {
  margin-bottom: 15px;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #020604;
  color: #00ff80;
  border: 1px solid #00ff8066;
  border-radius: 5px;
  font-family: monospace;
  outline: none;
}

input:focus {
  border-color: #00ff80;
  box-shadow: 0 0 10px #00ff8033;
}

button {
  background: #06351e;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #00ff80;
  color: #000;
}

.hidden {
  display: none !important;
}

#authStatus {
  margin-top: 15px;
  color: #ff5555;
  overflow-wrap: anywhere;
}

.rooms {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 15px 0;
}

.rooms button {
  flex: 1;
  min-width: 105px;
}

.rooms button.active {
  background: #00ff80;
  color: black;
}

#messages {
  height: 350px;
  overflow-y: auto;
  background: #020604;
  border: 1px solid #145d39;
  padding: 12px;
  border-radius: 5px;
}

.message {
  padding: 12px;
  margin-bottom: 10px;
  background: #0b1910;
  border-left: 3px solid #00ff80;
  overflow-wrap: anywhere;
}

.message .username {
  color: #00ff80;
  font-weight: bold;
}

.message .admin {
  color: #3995ff;
  font-weight: bold;
}

.admin-badge {
  color: #3995ff;
  border: 1px solid #3995ff;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 10px;
  margin-left: 5px;
}

.message small {
  display: block;
  color: #668875;
  margin-top: 7px;
}

#chatForm {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

#chatForm input {
  flex: 1;
}

#chatForm button {
  width: 90px;
}

.status {
  color: #00ff80;
  margin-bottom: 10px;
}

.admin-text {
  color: #3995ff;
  font-weight: bold;
}

footer {
  padding: 25px;
  text-align: center;
  color: #426b53;
}

@media(max-width:500px) {
  #chatForm button {
    width: 75px;
  }
}
</style>
</head>

<body>

<header>
  <h1>GHOSTLINK</h1>
  <p>[ SECURE COMMUNICATION NETWORK ]</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginPanel" class="panel">
    <h2>IDENTITY VERIFICATION</h2>
    <p>Enter your username to access the network.</p>

    <input
      id="username"
      type="text"
      maxlength="25"
      placeholder="Kullanıcı adınızı girin..."
    >

    <button id="enterBtn">ENTER NETWORK</button>

    <p style="text-align:center;margin:15px 0;color:#456b51">
      ───── OR ─────
    </p>

    <button id="adminBtn">
      ADMIN GOOGLE LOGIN
    </button>

    <p id="authStatus"></p>
  </div>

  <!-- CHAT -->
  <div id="chatPanel" class="panel hidden">

    <div class="status">
      ● SYSTEM ONLINE
      <span id="currentUser"></span>
    </div>

    <button id="logoutBtn">LOGOUT</button>

    <h3 style="margin-top:20px">CHAT CHANNELS</h3>

    <div class="rooms">
      <button data-room="General" class="active">General</button>
      <button data-room="Cyber Security">Cyber Security</button>
      <button data-room="Linux">Linux</button>
      <button data-room="Programming">Programming</button>
      <button data-room="Technology">Technology</button>
    </div>

    <h3 id="roomTitle"># General</h3>

    <div id="messages">
      Connecting...
    </div>

    <form id="chatForm">
      <input
        id="messageInput"
        maxlength="1000"
        placeholder="Mesajınızı yazın..."
        autocomplete="off"
      >
      <button type="submit">SEND</button>
    </form>

  </div>
</div>

<footer>
  GHOSTLINK NETWORK © 2026
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

// FIREBASE CONFIG

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// ADMIN EMAIL
// Buraya kendi Google/Firebase hesabının e-postasını yaz.

const ADMIN_EMAIL = "your-email@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let currentRoom = "General";
let currentUsername = "";
let isAdmin = false;
let unsubscribeMessages = null;

// NORMAL USER LOGIN

$("enterBtn").onclick = async () => {

  const username = $("username").value.trim();

  if (!username || username.length < 2) {
    $("authStatus").textContent =
      "Lütfen geçerli bir kullanıcı adı yazın.";
    return;
  }

  if (username.toUpperCase() === "ADMIN") {
    $("authStatus").textContent =
      "Bu isim yalnızca doğrulanmış yöneticiye aittir.";
    return;
  }

  try {
    $("enterBtn").disabled = true;

    // Önceki oturumu kapat.
    if (auth.currentUser) {
      await signOut(auth);
    }

    localStorage.setItem("ghostlink_username", username);

    await signInAnonymously(auth);

  } catch (error) {
    $("authStatus").textContent = error.message;
    $("enterBtn").disabled = false;
  }
};

// ADMIN GOOGLE LOGIN

$("adminBtn").onclick = async () => {

  try {
    $("adminBtn").disabled = true;

    if (auth.currentUser) {
      await signOut(auth);
    }

    const provider = new GoogleAuthProvider();

    const result = await signInWithPopup(auth, provider);

    const email = result.user.email || "";

    if (
      email.toLowerCase() !== ADMIN_EMAIL.toLowerCase() ||
      !result.user.emailVerified
    ) {
      await signOut(auth);

      $("authStatus").textContent =
        "Bu Google hesabı yönetici hesabı değil.";

      return;
    }

    localStorage.removeItem("ghostlink_username");

  } catch (error) {
    $("authStatus").textContent = error.message;
  } finally {
    $("adminBtn").disabled = false;
  }
};

// AUTH STATE

onAuthStateChanged(auth, user => {

  $("enterBtn").disabled = false;

  if (!user) {
    $("loginPanel").classList.remove("hidden");
    $("chatPanel").classList.add("hidden");

    if (unsubscribeMessages) {
      unsubscribeMessages();
      unsubscribeMessages = null;
    }

    return;
  }

  if (
    user.email &&
    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() &&
    user.emailVerified
  ) {

    isAdmin = true;
    currentUsername = "ADMIN";

  } else if (user.isAnonymous) {

    isAdmin = false;
    currentUsername =
      localStorage.getItem("ghostlink_username");

    if (!currentUsername) {
      signOut(auth);
      return;
    }

  } else {
    signOut(auth);
    return;
  }

  $("loginPanel").classList.add("hidden");
  $("chatPanel").classList.remove("hidden");

  $("currentUser").textContent =
    " | " + currentUsername;

  $("currentUser").className =
    isAdmin ? "admin-text" : "";

  loadMessages();
});

// LOGOUT

$("logoutBtn").onclick = async () => {
  if (!isAdmin) {
    localStorage.removeItem("ghostlink_username");
  }

  await signOut(auth);
};

// LOAD MESSAGES

function loadMessages() {

  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  $("messages").textContent = "Loading messages...";

  const q = query(
    collection(db, "messages"),
    where("room", "==", currentRoom),
    orderBy("createdAt", "asc"),
    limit(100)
  );

  unsubscribeMessages = onSnapshot(q, snapshot => {

    $("messages").innerHTML = "";

    snapshot.forEach(doc => {

      const data = doc.data();

      const message = document.createElement("div");
      message.className = "message";

      const name = document.createElement("span");

      name.className = data.isAdmin
        ? "admin"
        : "username";

      name.textContent = data.username || "Anonymous";

      if (data.isAdmin) {
        const badge = document.createElement("span");
        badge.className = "admin-badge";
        badge.textContent = "ADMIN";
        name.appendChild(badge);
      }

      const content = document.createElement("div");
      content.textContent = data.text || "";

      const time = document.createElement("small");

      time.textContent = data.createdAt?.toDate
        ? data.createdAt.toDate().toLocaleTimeString()
        : "Sending...";

      message.append(name, content, time);

      $("messages").appendChild(message);

    });

    $("messages").scrollTop =
      $("messages").scrollHeight;

  }, error => {

    $("messages").textContent =
      "Database error: " + error.message;

  });
}

// SEND MESSAGE

$("chatForm").onsubmit = async event => {

  event.preventDefault();

  const text = $("messageInput").value.trim();

  if (!text || !auth.currentUser) return;

  if (text.length > 1000) return;

  const button = $("chatForm").querySelector("button");
  button.disabled = true;

  try {

    await addDoc(collection(db, "messages"), {

      uid: auth.currentUser.uid,

      username: currentUsername,

      isAdmin: isAdmin,

      text: text,

      room: currentRoom,

      createdAt: serverTimestamp()

    });

    $("messageInput").value = "";

  } catch (error) {

    alert("Mesaj gönderilemedi: " + error.message);

  } finally {
    button.disabled = false;
  }
};

// ROOM SWITCH

document.querySelectorAll("[data-room]")
.forEach(button => {

  button.onclick = () => {

    currentRoom = button.dataset.room;

    document.querySelectorAll("[data-room]")
    .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    $("roomTitle").textContent = "# " + currentRoom;

    loadMessages();
  };
});

</script>
</body>
</html>
